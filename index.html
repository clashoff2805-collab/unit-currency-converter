<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Підключення Vue 3 через CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <header>
      <h1>Конвертер валют і одиниць</h1>
    </header>

    <!-- Кореневий елемент для Vue -->
    <main id="app">
      <section class="card type-selection">
        <h2>Вибір типу конвертації</h2>
        <form class="type-form">
          <label class="radio-label">
            <input
              type="radio"
              name="conversion-type"
              value="currency"
              checked
            />
            <span>Валюта</span>
          </label>
        </form>
      </section>

      <!-- Компонент форми конвертації та історії -->
      <converter-form></converter-form>
    </main>

    <footer>
      <p>
        Усі курси валют та коефіцієнти надані через Frankfurter API (ЄЦБ).
        Виконано студентом групи ІП-51 Тихим Денисом. &copy; 2026.
      </p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
